name: Hussaini Production Studio CI (Skill & DSP Engine Validation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-skill-and-dsp:
    name: Validate Skill Docs, Pylint, Unit Tests & DSP Engine (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install DSP, Lint & Test dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Skill Structure, Router Size (<=10.5KB) & Single-Source VERSION
        run: |
          test -f VERSION
          test -f SKILL.md
          test -f README.md
          test -f requirements.txt
          test -f references/atwar_maqamat_and_poetry_guide.md
          test -f references/radoods_and_khutaba_encyclopedia.md
          test -f references/modules/experimental_ab_evaluation_and_human_review.md
          test -f references/modules/module_39_json_preconditioning.md
          test -f references/modules/module_40_41_43_phonetics_and_dialects.md
          test -f references/modules/module_42_gireez_hosa_and_muharram_calendar.md
          test -f references/modules/module_44_studio_production_and_heavy_clips.md
          test -f references/modules/module_45_golden_larynx_and_reverse_engineering.md
          test -f scripts/hussaini_dsp_montage.py
          test -f tests/test_hussaini_modules.py
          SKILL_BYTES="$(wc -c < SKILL.md)"
          echo "SKILL.md size: ${SKILL_BYTES} bytes"
          test "$SKILL_BYTES" -le 10500
          VER="$(tr -d '\r\n' < VERSION)"
          grep -q "^name: hussaini-production-studio" SKILL.md
          grep -q "$VER" SKILL.md
          grep -q "$VER" README.md
          grep -q "$VER" references/atwar_maqamat_and_poetry_guide.md
          grep -q "$VER" references/radoods_and_khutaba_encyclopedia.md

      - name: Lint DSP Montage Script & Unit Tests with Pylint
        run: |
          pylint --disable=C0301,R0912,R0913,R0914,R0915,R0917 scripts/hussaini_dsp_montage.py tests/test_hussaini_modules.py

      - name: Run Unit, Negative-Edge, 24-Bit WAV & Idempotency Tests (Enforce >=70% Coverage)
        run: |
          pytest -v --cov=scripts --cov-fail-under=70 tests/test_hussaini_modules.py

      - name: Test CLI Lyrics Compiler, Poem Linter & Multi-Rate/Stereo/24-Bit 7-Mode DSP Engine
        run: |
          python scripts/hussaini_dsp_montage.py --compile-lyrics "ياحسين يا خويه شلون قلب وقلبي والصبر والجمرة ويبوفاضل بضلوعي"
          python scripts/hussaini_dsp_montage.py --lint-poem "ياحسين يا خويه شلون قلب وقلبي"
          python -c "import numpy as np; from scipy.io import wavfile
          for sr in (8000, 16000, 44100, 48000):
              t = np.linspace(0, 1.2, int(1.2*sr), endpoint=False)
              mono = (0.4*np.sin(2*np.pi*180.0*t)*32767).astype(np.int16)
              wavfile.write(f'/tmp/in_{sr}.wav', sr, mono)
          t44 = np.linspace(0, 1.2, int(1.2*44100), endpoint=False)
          sig = (0.4*np.sin(2*np.pi*180.0*t44)*32767).astype(np.int16)
          stereo = np.column_stack((sig, sig))
          wavfile.write('/tmp/in_stereo.wav', 44100, stereo)"
          for sr in 8000 16000 44100 48000; do
            python scripts/hussaini_dsp_montage.py --input "/tmp/in_${sr}.wav" --output "/tmp/out_${sr}.wav" --mode latm --bpm 60 --maqam-drone saba
            test -s "/tmp/out_${sr}.wav"
          done
          python scripts/hussaini_dsp_montage.py --input /tmp/in_stereo.wav --output /tmp/out_stereo.wav --mode bandari --bpm 88 --swing 0.22 --maqam-drone kurd
          test -s /tmp/out_stereo.wav
          for mode in latm heavy_clip zanjeel_iraqi zanjeel_bahrani shoor bandari mawal nai; do
            python scripts/hussaini_dsp_montage.py --input /tmp/in_16000.wav --output "/tmp/test_out_${mode}.wav" --mode "$mode" --bpm 66 --maqam-drone nahawand --foley wind --audio-drop-sec 0.2
            test -s "/tmp/test_out_${mode}.wav"
          done
