name: Hussaini Production Studio CI (Skill & DSP Engine Validation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-skill-and-dsp:
    name: Validate Skill Docs, Pylint, Unit Tests & DSP Montage Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DSP, Lint & Test dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Skill Structure & V45.0 Version Consistency Across All Files
        run: |
          test -f SKILL.md
          test -f README.md
          test -f requirements.txt
          test -f references/atwar_maqamat_and_poetry_guide.md
          test -f references/radoods_and_khutaba_encyclopedia.md
          test -f scripts/hussaini_dsp_montage.py
          test -f tests/test_hussaini_modules.py
          grep -q "^name: hussaini-production-studio" SKILL.md
          grep -q "V45.0 OMNI-ARCHITECT" SKILL.md
          grep -q "V45.0 OMNI-ARCHITECT" README.md
          grep -q "V45.0 OMNI-ARCHITECT" references/atwar_maqamat_and_poetry_guide.md
          grep -q "V45.0 OMNI-ARCHITECT" references/radoods_and_khutaba_encyclopedia.md
          grep -q "V45.0 OMNI-ARCHITECT" scripts/hussaini_dsp_montage.py
          grep -q "Hussaini_Production_Studio_OS_V45_OMNI_ARCHITECT" README.md
          grep -q "Hussaini_Production_Studio_OS_V45_OMNI_ARCHITECT" references/atwar_maqamat_and_poetry_guide.md

      - name: Lint DSP Montage Script & Unit Tests with Pylint
        run: |
          pylint --disable=C0301,R0912,R0913,R0914,R0917 scripts/hussaini_dsp_montage.py tests/test_hussaini_modules.py

      - name: Run Unit Tests for Modules 34, 38, 39, 40, 41, 43 & 5-Track DSP Engine
        run: |
          pytest -v tests/test_hussaini_modules.py

      - name: Test Hussaini CLI Lyrics Compiler & DSP Montage Engine Across All 7 Modes
        run: |
          python scripts/hussaini_dsp_montage.py --compile-lyrics "ياحسين يا خويه شلون قلب وچبد ودمع وعينٍ تسيل"
          python -c "import numpy as np; from scipy.io import wavfile; sr=16000; t=np.linspace(0, 2.0, 2*sr, endpoint=False); sig=(0.5*np.sin(2*np.pi*160.0*t)*32767).astype(np.int16); wavfile.write('/tmp/test_in.wav', sr, sig)"
          for mode in latm zanjeel_iraqi zanjeel_bahrani shoor bandari mawal nai; do
            python scripts/hussaini_dsp_montage.py --input /tmp/test_in.wav --output "/tmp/test_out_${mode}.wav" --mode "$mode" --bpm 60 --maqam-drone saba
            test -s "/tmp/test_out_${mode}.wav"
          done
